    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <h1 class="mb-0 fs-3">Table Bookings</h1>
        </div>
      </div>

      <div class="app-content">
        <div class="container-fluid">
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <strong>Table Booking Requests</strong>
              <select class="form-select form-select-sm w-auto ms-auto" id="statusFilter" onchange="loadBookings()">
                <option value="">All</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
            <div class="table-responsive">
              <table class="table mb-0 align-middle">
                <thead><tr><th>Name</th><th>Contact</th><th>Guests</th><th>Date & Time</th><th>Message</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="bookingBody">
                  <tr><td colspan="7" class="text-center text-muted py-4">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <script>
            function statusBadge(status) {
              const map = { pending: 'warning', approved: 'success', rejected: 'danger' };
              return `<span class="badge text-bg-${map[status] || 'secondary'}">${status}</span>`;
            }

            async function loadBookings() {
              const status = document.getElementById('statusFilter').value;
              const url = status ? `/api/bookings?status=${status}` : '/api/bookings';
              const res = await fetch(url);
              if (res.status === 401) {
                window.location.href = '../login.html';
                return;
              }
              const items = await res.json();
              const tbody = document.getElementById('bookingBody');
              tbody.innerHTML = '';
              if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No booking requests yet</td></tr>';
                return;
              }
              items.forEach(b => {
                let actions = '';
                if (b.status === 'pending') {
                  actions = `
                    <button class="btn btn-outline-success btn-sm icon-btn me-1" title="Accept" onclick="setStatus(${b.id}, 'approved')"><i class="bi bi-check-lg"></i></button>
                    <button class="btn btn-outline-danger btn-sm icon-btn me-1" title="Reject" onclick="setStatus(${b.id}, 'rejected')"><i class="bi bi-x-lg"></i></button>
                    <button class="btn btn-outline-secondary btn-sm icon-btn" title="Delete" onclick="deleteBooking(${b.id})"><i class="bi bi-trash"></i></button>
                  `;
                } else if (b.status === 'approved') {
                  actions = `
                    <button class="btn btn-outline-danger btn-sm icon-btn me-1" title="Reject" onclick="setStatus(${b.id}, 'rejected')"><i class="bi bi-x-lg"></i></button>
                    <button class="btn btn-outline-secondary btn-sm icon-btn" title="Delete" onclick="deleteBooking(${b.id})"><i class="bi bi-trash"></i></button>
                  `;
                } else {
                  actions = `
                    <button class="btn btn-outline-success btn-sm icon-btn me-1" title="Accept" onclick="setStatus(${b.id}, 'approved')"><i class="bi bi-check-lg"></i></button>
                    <button class="btn btn-outline-secondary btn-sm icon-btn" title="Delete" onclick="deleteBooking(${b.id})"><i class="bi bi-trash"></i></button>
                  `;
                }

                tbody.innerHTML += `<tr>
                  <td>${b.customer_name}</td>
                  <td>${b.phone || ''}<br><small class="text-muted">${b.email || ''}</small></td>
                  <td>${b.guests || ''}</td>
                  <td>${b.date || ''} ${b.time || ''}</td>
                  <td>${b.message || ''}</td>
                  <td>${statusBadge(b.status)}</td>
                  <td>${actions}</td>
                </tr>`;
              });
            }

            async function setStatus(id, status) {
              await fetch(`/api/bookings/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
              });
              loadBookings();
            }

            async function deleteBooking(id) {
              if (!confirm('Remove this booking record?')) return;
              await fetch(`/api/bookings/${id}`, { method: 'DELETE' });
              loadBookings();
            }

            loadBookings();
          </script>

        </div>
      </div>
    </main>
