<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bella Fiamma | Admin Login</title>
  <link rel="stylesheet" href="css/admin-login.css">
  <script type="module">
    try {
      const res = await fetch('/api/check-auth');
      if (res.ok) window.location.href = 'dashboard.html';
    } catch (err) {
      console.error('Check auth error:', err);
    }
  </script>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="brand-name">Bella <span>Fiamma</span></div>
      <div class="subtitle">Admin Dashboard Login</div>

      <p id="loginError" style="color: #ff4d4d; font-size: 13px; margin-bottom: 16px; display: none;"></p>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username" minlength="2">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" minlength="4">
        </div>

        <div class="extra-row">
          <label class="remember-me" for="remember">
            <input type="checkbox" id="remember" name="remember">
            Remember me
          </label>
          <a href="#" class="forgot" onclick="alert('Please contact the system administrator to reset your password.'); return false;">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Login</button>
      </form>

      <div class="footer-text">
        &copy; 2026 Bella Fiamma. All rights reserved.
      </div>

    </div>
  </div>

  <script type="module">
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await res.json().catch(err => {
          console.error('JSON parse error:', err);
          return {};
        });

        if (!res.ok) {
          errorEl.textContent = result.error || 'Invalid username or password.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Login';
          return;
        }

        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        console.error('Login submission error:', err);
        errorEl.textContent = 'Connection error. Please try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>

</body>
</html>
