    .word-counter { font-size: .8rem; color: #6c757d; }
    .field-error { color: #dc3545; font-size: .825rem; margin-top: .25rem; display: none; }
    .rating-star { color: #ffc107; }
    .card-header::after { display: none !important; }

        const res = await fetch('/api/check-auth');
        if (!res.ok) window.location.href = '../login.html';
      } catch(e) {
        window.location.href = '../login.html';
      }
    })();
  </script>

    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <h1 class="mb-0 fs-3">Food Categories</h1>
        </div>
      </div>

      <div class="app-content">
        <div class="container-fluid">
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <strong>Our Food Categories</strong>
              <button class="btn btn-primary btn-sm" onclick="openCatModal()"><i class="bi bi-plus-lg"></i> Add Category</button>
            </div>
            <div class="table-responsive">
              <table class="table mb-0 align-middle">
                <thead><tr><th>Image</th><th>Name</th><th>Description</th><th>Price</th><th>Action</th></tr></thead>
                <tbody id="catBody">
                  <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Add / Edit Category Modal -->
          <div class="modal fade" id="catModal" tabindex="-1">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="catModalTitle">Add Food Category</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="catForm">
                  <div class="modal-body">
                    <input type="hidden" id="catId">

                    <div class="mb-3">
                      <label class="form-label" for="catName">Name</label>
                      <input type="text" class="form-control" id="catName" required minlength="2">
                      <div class="field-error" id="catNameError"></div>
                    </div>

                    <div class="mb-3">
                      <label class="form-label d-flex justify-content-between" for="catDesc">
                        <span>Description</span>
                        <span class="word-counter"><span id="catDescCount">0</span> / 60 words</span>
                      </label>
                      <textarea class="form-control" id="catDesc" rows="3"></textarea>
                      <div class="field-error" id="catDescError"></div>
                    </div>

                    <div class="mb-3">
                      <label class="form-label" for="catPrice">Price ($)</label>
                      <input type="number" class="form-control" id="catPrice" step="1" min="1" placeholder="e.g. 15" required>
                      <div class="field-error" id="catPriceError"></div>
                    </div>

                    <div class="mb-3">
                      <label class="form-label" for="catImage">Image</label>
                      <input type="file" class="form-control" id="catImage" accept="image/png,image/jpeg,image/webp,image/gif">
                      <div class="field-error" id="catImageError"></div>
                    </div>
                  </div>
                  <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <script>
            function escapeHtml(str) {
              if (str == null) return '';
              return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
            }

            async function uploadImageIfSelected(inputEl) {
              if (!inputEl.files || !inputEl.files[0]) return null;
              const formData = new FormData();
              formData.append('image', inputEl.files[0]);
              const res = await fetch('/api/upload', { method: 'POST', body: formData });
              if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || 'Image upload failed.');
              }
              const data = await res.json();
              return data.path;
            }

            function showError(el, message) {
              el.textContent = message;
              el.style.display = message ? 'block' : 'none';
            }

            let _catModal;
            function getCatModal() {
              if (!_catModal) _catModal = new bootstrap.Modal(document.getElementById('catModal'));
              return _catModal;
            }

            document.getElementById('catDesc').addEventListener('input', (e) => {
              const words = e.target.value.trim().split(/\s+/).filter(Boolean);
              document.getElementById('catDescCount').textContent = words.length;
            });

            function openCatModal(cat) {
              document.getElementById('catForm').reset();
              document.getElementById('catDescCount').textContent = '0';
              ['catNameError','catDescError','catPriceError','catImageError'].forEach(id => showError(document.getElementById(id), ''));

              if (cat) {
                document.getElementById('catModalTitle').textContent = 'Edit Food Category';
                document.getElementById('catId').value = cat.id;
                document.getElementById('catName').value = cat.name;
                document.getElementById('catDesc').value = cat.description || '';
                document.getElementById('catPrice').value = cat.price;
                const words = (cat.description || '').trim().split(/\s+/).filter(Boolean);
                document.getElementById('catDescCount').textContent = words.length;
              } else {
                document.getElementById('catModalTitle').textContent = 'Add Food Category';
                document.getElementById('catId').value = '';
              }
              getCatModal().show();
            }

            async function loadCategories() {
              try {
                const res = await fetch('/api/categories');
                const items = await res.json();
                const tbody = document.getElementById('catBody');
                tbody.innerHTML = '';
                if (!items || items.length === 0) {
                  tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No food categories yet</td></tr>';
                  return;
                }
                window.__categories = items;
                items.forEach(c => {
                  const img = c.image ? `<img src="/${escapeHtml(c.image)}" class="thumb-img" alt="${escapeHtml(c.name)}">` : '<span class="text-muted">No image</span>';
                  tbody.innerHTML += `<tr>
                    <td>${img}</td>
                    <td>${escapeHtml(c.name)}</td>
                    <td>${escapeHtml(c.description || '')}</td>
                    <td>$${Number(c.price).toFixed(2)}</td>
                    <td>
                      <button class="btn btn-outline-primary btn-sm icon-btn" aria-label="Edit category" onclick="editCategory(${c.id})"><i class="bi bi-pencil"></i></button>
                      <button class="btn btn-outline-danger btn-sm icon-btn" aria-label="Delete category" onclick="deleteCategory(${c.id})"><i class="bi bi-trash"></i></button>
                    </td>
                  </tr>`;
                });
              } catch (err) {
                console.error('Failed to load categories:', err);
              }
            }

            function editCategory(id) {
              const cat = (window.__categories || []).find(c => c.id === id);
              if (cat) openCatModal(cat);
            }

            async function deleteCategory(id) {
              if (!confirm('Delete this category? This cannot be undone.')) return;
              try {
                await fetch(`/api/categories/${id}`, { method: 'DELETE' });
                loadCategories();
              } catch (err) {
                console.error('Failed to delete category:', err);
              }
            }

            document.getElementById('catForm').addEventListener('submit', async (e) => {
              e.preventDefault();

              ['catNameError','catDescError','catPriceError','catImageError'].forEach(id => showError(document.getElementById(id), ''));

              const nameRaw = document.getElementById('catName').value;
              const name = nameRaw.trim();
              const description = document.getElementById('catDesc').value.trim();
              const price = document.getElementById('catPrice').value;
              const id = document.getElementById('catId').value;
              let hasError = false;

              if (!nameRaw || !/^[^\s]+(?: [^\s]+)*$/.test(nameRaw) || name.length < 2) {
                showError(document.getElementById('catNameError'), 'Name cannot be empty, must not have leading/trailing spaces, and allows only 1 single space between words.');
                hasError = true;
              }
              if (description.split(/\s+/).filter(Boolean).length > 60) {
                showError(document.getElementById('catDescError'), 'Description must be 60 words or fewer.');
                hasError = true;
              }
              if (!price || !/^\d+$/.test(price) || Number(price) <= 0) {
                showError(document.getElementById('catPriceError'), 'Price must be a valid whole integer number (e.g., 15).');
                hasError = true;
              }
              if (hasError) return;

              try {
                const imagePath = await uploadImageIfSelected(document.getElementById('catImage'));
                const payload = { name, description, price, image: imagePath };

                const res = id
                  ? await fetch(`/api/categories/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) })
                  : await fetch('/api/categories', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });

                const result = await res.json();
                if (!res.ok) { showError(document.getElementById('catPriceError'), result.error || 'Something went wrong.'); return; }

                getCatModal().hide();
                loadCategories();
              } catch (err) {
                showError(document.getElementById('catImageError'), err.message);
              }
            });

            loadCategories();
            if (new URLSearchParams(window.location.search).get('action') === 'add') {
              openCatModal();
            }
          </script>

        </div>
      </div>
    </main>

  <script>
    async function doLogout(e) {
      e.preventDefault();
      try {
        await fetch('/api/logout', { method: 'POST' });
      } catch (err) {
        console.error('Logout error:', err);
      }
      window.location.href = '../login.html';
    }
  </script>
