      <div class="app-content-header">
        <div class="container-fluid">
          <h1 class="mb-0 fs-3">Add Food</h1>
        </div>
      </div>

      <div class="app-content">
        <div class="container-fluid">

          <form id="foodForm">
            <div class="mb-3">
              <label for="name" class="form-label">Food Name</label>
              <input type="text" class="form-control" id="name" placeholder="Food name" required>
            </div>
            <div class="mb-3">
              <label for="price" class="form-label">Price</label>
              <input type="number" class="form-control" id="price" placeholder="Price (integer e.g. 15)" step="1" min="1" required>
            </div>
            <div class="mb-3">
              <label for="category_id" class="form-label">Category</label>
              <select class="form-select" id="category_id" required></select>
            </div>
            <button type="submit" class="btn btn-primary">Add Food</button>
          </form>

          <script>
            function escapeHtml(str) {
              if (str == null) return '';
              return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
            }

            async function loadCategoryOptions() {
              try {
                const res = await fetch('/api/categories');
                const items = await res.json();
                const select = document.getElementById('category_id');
                select.innerHTML = '<option value="">Select category</option>';
                if (!items) return;
                items.forEach(c => {
                  select.innerHTML += `<option value="${c.id}">${escapeHtml(c.name)}</option>`;
                });
              } catch (err) {
                console.error('Failed to load categories:', err);
              }
            }
            loadCategoryOptions();

            document.getElementById('foodForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              const nameRaw = document.getElementById('name').value;
              const price = document.getElementById('price').value;

              if (!nameRaw || !/^[^\s]+(?: [^\s]+)*$/.test(nameRaw)) {
                alert('Name cannot be empty, must not have leading/trailing spaces, and allows only 1 single space between words.');
                return;
              }
              if (!price || !/^\d+$/.test(price) || Number(price) <= 0) {
                alert('Price must be a valid whole integer number (e.g., 15).');
                return;
              }

              try {
                const res = await fetch('/api/food', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    name: nameRaw.trim(),
                    price: price,
                    category_id: document.getElementById('category_id').value
                  })
                });
                if (res.ok) {
                  alert('Food added!');
                  document.getElementById('foodForm').reset();
                } else {
                  const err = await res.json().catch(() => ({}));
                  alert(err.error || 'Failed to add food.');
                }
              } catch (err) {
                alert('Connection error. Failed to add food.');
              }
            });
          </script>

        </div>
