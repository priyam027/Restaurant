    <!-- Main content -->
    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <h1 class="mb-0 fs-3">Add Offer</h1>
        </div>
      </div>

      <div class="app-content">
        <div class="container-fluid">

          <form id="offerForm">
            <div class="mb-3">
              <label for="title" class="form-label">Offer Title</label>
              <input type="text" class="form-control" id="title" placeholder="Offer title" required>
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description" placeholder="Description"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Offer</button>
          </form>

          <script>
            document.getElementById('offerForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              const titleRaw = document.getElementById('title').value;

              if (!titleRaw || !/^[^\s]+(?: [^\s]+)*$/.test(titleRaw)) {
                alert('Title cannot be empty, must not have leading/trailing spaces, and allows only 1 single space between words.');
                return;
              }

              try {
                const res = await fetch('/api/offers', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    title: titleRaw.trim(),
                    description: document.getElementById('description').value.trim()
                  })
                });
                if (res.ok) {
                  alert('Offer added!');
                  document.getElementById('offerForm').reset();
                } else {
                  const err = await res.json().catch(() => ({}));
                  alert(err.error || 'Failed to add offer.');
                }
              } catch (err) {
                alert('Connection error. Failed to add offer.');
              }
            });
          </script>

        </div>
      </div>
    </main>
