    .icon-btn { width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .stat-card { border: none; color: #fff; border-radius: .5rem; }
    .stat-card .stat-icon { font-size: 2rem; opacity: .85; }
    .thumb-img { width: 56px; height: 56px; object-fit: cover; border-radius: .375rem; }
    .modal-header { border-bottom: 1px solid #dee2e6; }
    .word-counter { font-size: .8rem; color: #6c757d; }
    .field-error { color: #dc3545; font-size: .825rem; margin-top: .25rem; display: none; }
    .rating-star { color: #ffc107; }
    .card-header::after { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
  <script>
    (async function() {
      try {
        const res = await fetch('/api/check-auth');
        if (!res.ok) window.location.href = '../login.html';
      } catch(e) {
        window.location.href = '../login.html';
      }
    })();
  </script>

          </ul>

            <i class="bi bi-fire text-warning fs-4 me-1"></i>

        <div class="sidebar-wrapper">

    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <h1 class="mb-0 fs-3">Customer Reviews</h1>
        </div>
      </div>

      <div class="app-content">
        <div class="container-fluid">
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <strong>What Our Customers Say</strong>
              <button class="btn btn-primary btn-sm" onclick="openReviewModal()"><i class="bi bi-plus-lg"></i> Add Review</button>
            </div>
            <div class="table-responsive">
              <table class="table mb-0 align-middle">
                <thead><tr><th>Image</th><th>Name</th><th>Role</th><th>Review</th><th>Rating</th><th>Action</th></tr></thead>
                <tbody id="reviewBody">
                  <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="modal fade" id="reviewModal" tabindex="-1">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="reviewModalTitle">Add Review</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="reviewForm">
                  <div class="modal-body">
                    <input type="hidden" id="reviewId">

                    <div class="mb-3">
                      <label class="form-label" for="reviewName">Name</label>
                      <input type="text" class="form-control" id="reviewName" required minlength="2">
                      <div class="field-error" id="reviewNameError"></div>
                    </div>

                    <div class="mb-3">
                      <label class="form-label" for="reviewRole">Role (e.g. "Regular Customer")</label>
                      <input type="text" class="form-control" id="reviewRole">
                    </div>

                    <div class="mb-3">
                      <label class="form-label" for="reviewRating">Rating</label>
                      <select class="form-select" id="reviewRating" required>
                        <option value="">Select rating</option>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Terrible</option>
                      </select>
                      <div class="field-error" id="reviewRatingError"></div>
                    </div>

                    <div class="mb-3">
                      <label class="form-label d-flex justify-content-between" for="reviewComment">
                        <span>Review</span>
                        <span class="word-counter"><span id="reviewCommentCount">0</span> / 60 words</span>
                      </label>
                      <textarea class="form-control" id="reviewComment" rows="3"></textarea>
                      <div class="field-error" id="reviewCommentError"></div>
                    </div>

                    <div class="mb-3">
                      <label class="form-label" for="reviewImage">Image</label>
                      <input type="file" class="form-control" id="reviewImage" accept="image/png,image/jpeg,image/webp,image/gif">
                      <div class="field-error" id="reviewImageError"></div>
                    </div>
                  </div>
                  <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <script>
            function escapeHtml(str) {
              if (str == null) return '';
              return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
            }

            async function uploadImageIfSelected(inputEl) {
              if (!inputEl.files || !inputEl.files[0]) return null;
              const formData = new FormData();
              formData.append('image', inputEl.files[0]);
              const res = await fetch('/api/upload', { method: 'POST', body: formData });
              if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || 'Image upload failed.');
              }
              const data = await res.json();
              return data.path;
            }

            function showError(el, message) {
              el.textContent = message;
              el.style.display = message ? 'block' : 'none';
            }

            let _reviewModal;
            function getReviewModal() {
              if (!_reviewModal) _reviewModal = new bootstrap.Modal(document.getElementById('reviewModal'));
              return _reviewModal;
            }

            document.getElementById('reviewComment').addEventListener('input', (e) => {
              const words = e.target.value.trim().split(/\s+/).filter(Boolean);
              document.getElementById('reviewCommentCount').textContent = words.length;
            });

            function stars(n) {
              const num = Math.min(5, Math.max(1, Number(n) || 5));
              return '★'.repeat(num) + '☆'.repeat(5 - num);
            }

            function openReviewModal(review) {
              document.getElementById('reviewForm').reset();
              document.getElementById('reviewCommentCount').textContent = '0';
              ['reviewNameError','reviewRatingError','reviewCommentError','reviewImageError'].forEach(id => showError(document.getElementById(id), ''));

              if (review) {
                document.getElementById('reviewModalTitle').textContent = 'Edit Review';
                document.getElementById('reviewId').value = review.id;
                document.getElementById('reviewName').value = review.customer_name;
                document.getElementById('reviewRole').value = review.role || '';
                document.getElementById('reviewRating').value = review.rating;
                document.getElementById('reviewComment').value = review.comment || '';
                const words = (review.comment || '').trim().split(/\s+/).filter(Boolean);
                document.getElementById('reviewCommentCount').textContent = words.length;
              } else {
                document.getElementById('reviewModalTitle').textContent = 'Add Review';
                document.getElementById('reviewId').value = '';
              }
              getReviewModal().show();
            }

            async function loadReviews() {
              try {
                const res = await fetch('/api/reviews');
                const items = await res.json();
                window.__reviews = items;
                const tbody = document.getElementById('reviewBody');
                tbody.innerHTML = '';
                if (!items || items.length === 0) {
                  tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No reviews yet</td></tr>';
                  return;
                }
                items.forEach(r => {
                  const img = r.image ? `<img src="/${escapeHtml(r.image)}" class="thumb-img" alt="${escapeHtml(r.customer_name)}">` : '<span class="text-muted">No image</span>';
                  tbody.innerHTML += `<tr>
                    <td>${img}</td>
                    <td>${escapeHtml(r.customer_name)}</td>
                    <td>${escapeHtml(r.role || '')}</td>
                    <td>${escapeHtml(r.comment || '')}</td>
                    <td class="rating-star">${stars(r.rating)}</td>
                    <td>
                      <button class="btn btn-outline-primary btn-sm icon-btn" aria-label="Edit review" onclick="editReview(${r.id})"><i class="bi bi-pencil"></i></button>
                      <button class="btn btn-outline-danger btn-sm icon-btn" aria-label="Delete review" onclick="deleteReview(${r.id})"><i class="bi bi-trash"></i></button>
                    </td>
                  </tr>`;
                });
              } catch (err) {
                console.error('Failed to load reviews:', err);
              }
            }

            function editReview(id) {
              const review = (window.__reviews || []).find(r => r.id === id);
              if (review) openReviewModal(review);
            }

            async function deleteReview(id) {
              if (!confirm('Delete this review?')) return;
              try {
                await fetch(`/api/reviews/${id}`, { method: 'DELETE' });
                loadReviews();
              } catch (err) {
                console.error('Failed to delete review:', err);
              }
            }

            document.getElementById('reviewForm').addEventListener('submit', async (e) => {
              e.preventDefault();

              ['reviewNameError','reviewRatingError','reviewCommentError','reviewImageError'].forEach(id => showError(document.getElementById(id), ''));

              const nameRaw = document.getElementById('reviewName').value;
              const customer_name = nameRaw.trim();
              const roleRaw = document.getElementById('reviewRole').value;
              const role = roleRaw.trim();
              const rating = document.getElementById('reviewRating').value;
              const comment = document.getElementById('reviewComment').value.trim();
              const id = document.getElementById('reviewId').value;
              let hasError = false;

              if (!nameRaw || !/^[^\s]+(?: [^\s]+)*$/.test(nameRaw) || customer_name.length < 2) {
                showError(document.getElementById('reviewNameError'), 'Name cannot be empty, must not have leading/trailing spaces, and allows only 1 single space between words.');
                hasError = true;
              }
              if (roleRaw && !/^[^\s]+(?: [^\s]+)*$/.test(roleRaw)) {
                showError(document.getElementById('reviewNameError'), 'Role must not have leading/trailing spaces and allows only 1 single space between words.');
                hasError = true;
              }
              if (!rating) {
                showError(document.getElementById('reviewRatingError'), 'Please select a rating.');
                hasError = true;
              }
              if (comment.split(/\s+/).filter(Boolean).length > 60) {
                showError(document.getElementById('reviewCommentError'), 'Review must be 60 words or fewer.');
                hasError = true;
              }
              if (hasError) return;

              try {
                const imagePath = await uploadImageIfSelected(document.getElementById('reviewImage'));
                const payload = { customer_name, role, rating, comment, image: imagePath };

                const res = id
                  ? await fetch(`/api/reviews/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) })
                  : await fetch('/api/reviews', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });

                const result = await res.json();
                if (!res.ok) { showError(document.getElementById('reviewNameError'), result.error || 'Something went wrong.'); return; }

                getReviewModal().hide();
                loadReviews();
              } catch (err) {
                showError(document.getElementById('reviewImageError'), err.message);
              }
            });

            loadReviews();
            if (new URLSearchParams(window.location.search).get('action') === 'add') {
              openReviewModal();
            }
          </script>

        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"></script>

  <script>
    async function doLogout(e) {
      e.preventDefault();
      try {
        await fetch('/api/logout', { method: 'POST' });
      } catch (err) {
        console.error('Logout error:', err);
      }
      window.location.href = '../login.html';
    }
  </script>
